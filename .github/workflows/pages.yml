name: Deploy Scan Lab to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'scan-lab/index.html'
      - 'scan-lab/style.css'
      - 'scan-lab/app.js'
      - 'scan-lab/ply.js'
      - 'scan-lab/tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser code
        run: |
          node scan-lab/tests/check.cjs
          node scan-lab/tests/ply-test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p site/tests
          cp scan-lab/index.html scan-lab/style.css scan-lab/app.js scan-lab/ply.js site/
          cp scan-lab/tests/demo-depth.json site/tests/
          touch site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
