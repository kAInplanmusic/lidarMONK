name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scan-lab/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f scan-lab/backend/requirements.txt ]; then python -m pip install -r scan-lab/backend/requirements.txt; fi
      - name: Lint for syntax errors and undefined names
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Python tests
        env:
          OMP_NUM_THREADS: '2'
        run: python -m pytest scan-lab/backend/tests -v
      - name: Test browser code
        run: node scan-lab/tests/check.cjs
